<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
  </defs>

  <!-- Background Base (Clean Paper Slate) -->
  <rect width="1920" height="1080" fill="#F4F4F0"/>

  <!-- Left Terracotta Block (approx 28% width) -->
  <rect width="520" height="1080" fill="#D25647"/>

  <!-- Horizontal Mustard Yellow Stripe -->
  <rect y="240" width="1920" height="150" fill="#D4A017"/>

  <!-- Top Right Scalloped Yellow Accent -->
  <circle cx="1840" cy="80" r="120" fill="#D4A017" opacity="0.9"/>

  <!-- ================= CARDS (TEAL #239F85) ================= -->

  <!-- CARD 1 (Top-Left Wide Card, straddling red and paper) -->
  <g transform="translate(140, 160)" filter="url(#cardShadow)">
    <rect width="860" height="420" rx="28" fill="#239F85"/>
    <g transform="translate(48, 48)">
      <!-- Card Badge / Tag -->
      <rect width="180" height="32" rx="16" fill="#1B7A66"/>
      <text x="90" y="21" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">UNSUPERVISED MODEL</text>

      <!-- Card Title -->
      <text x="0" y="80" fill="#FFFFFF" font-size="28" font-weight="800">Validitas Pemodelan Klaster</text>
      <text x="0" y="112" fill="#E6FFFA" font-size="15" font-weight="400">Pengujian matematis kekompakan &amp; separasi profil sosial-ekonomi.</text>

      <!-- Key Metrics List -->
      <g transform="translate(0, 140)">
        <!-- Metric 1 -->
        <circle cx="12" cy="12" r="6" fill="#D4A017"/>
        <text x="32" y="16" fill="#FFFFFF" font-size="16" font-weight="700">Silhouette Score:</text>
        <text x="180" y="16" fill="#E6FFFA" font-size="15">Menguji pemisahan batas antarkelompok (k=3 teruji optimal 0.294).</text>

        <!-- Metric 2 -->
        <circle cx="12" cy="52" r="6" fill="#D4A017"/>
        <text x="32" y="56" fill="#FFFFFF" font-size="16" font-weight="700">Davies-Bouldin &amp; CH:</text>
        <text x="210" y="56" fill="#E6FFFA" font-size="15">Verifikasi rasio separasi jarak antarklaster.</text>

        <!-- Metric 3 -->
        <circle cx="12" cy="92" r="6" fill="#D4A017"/>
        <text x="32" y="96" fill="#FFFFFF" font-size="16" font-weight="700">Holdout Bersih:</text>
        <text x="160" y="96" fill="#E6FFFA" font-size="15">P0 &amp; target biner dikeluarkan dari training untuk validasi objektif.</text>
      </g>
    </g>
  </g>

  <!-- CARD 2 (Top-Right Square Card, over yellow stripe on paper) -->
  <g transform="translate(1060, 160)" filter="url(#cardShadow)">
    <rect width="720" height="420" rx="28" fill="#239F85"/>
    <g transform="translate(48, 48)">
      <!-- Card Badge / Tag -->
      <rect width="180" height="32" rx="16" fill="#1B7A66"/>
      <text x="90" y="21" fill="#A7F3D0" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SPATIAL AUDIT</text>

      <!-- Card Title -->
      <text x="0" y="80" fill="#FFFFFF" font-size="28" font-weight="800">Integritas Data &amp; Peta</text>
      <text x="0" y="112" fill="#E6FFFA" font-size="15" font-weight="400">Presisi geospasial 514 kabupaten/kota tanpa distorsi.</text>

      <!-- Key Points -->
      <g transform="translate(0, 140)">
        <circle cx="12" cy="12" r="6" fill="#D4A017"/>
        <text x="32" y="16" fill="#FFFFFF" font-size="16" font-weight="700">Cakupan Wilayah 100%:</text>
        <text x="235" y="16" fill="#E6FFFA" font-size="15">514 dari 514 daerah terpetakan utuh (0 missing).</text>

        <circle cx="12" cy="52" r="6" fill="#D4A017"/>
        <text x="32" y="56" fill="#FFFFFF" font-size="16" font-weight="700">Benchmark Median:</text>
        <text x="210" y="56" fill="#E6FFFA" font-size="15">Batas garis skrining objektif di P0 = 10.5% nasional.</text>

        <circle cx="12" cy="92" r="6" fill="#D4A017"/>
        <text x="32" y="96" fill="#FFFFFF" font-size="16" font-weight="700">Dokumentasi Anomali:</text>
        <text x="225" y="96" fill="#E6FFFA" font-size="15">Pencatatan resmi nilai 0% sanitasi Deiyai &amp; TPT Nduga.</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM ROW ================= -->

  <!-- TITLE: "Evaluasi" (Bottom-Left, across red boundary into paper) -->
  <g transform="translate(140, 720)">
    <text x="0" y="120" fill="#1C1C1C" font-size="96" font-weight="800" letter-spacing="-2">Evaluasi</text>
    
    <!-- Circled Arrow Icon ↗ -->
    <g transform="translate(460, 48)">
      <circle cx="40" cy="40" r="38" stroke="#1C1C1C" stroke-width="4.5" fill="#FFFFFF"/>
      <line x1="26" y1="54" x2="54" y2="26" stroke="#1C1C1C" stroke-width="5" stroke-linecap="round"/>
      <polyline points="32,26 54,26 54,48" stroke="#1C1C1C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- CARD 3 (Bottom-Right Text Container) -->
  <g transform="translate(1060, 660)" filter="url(#cardShadow)">
    <rect width="720" height="280" rx="28" fill="#239F85"/>
    <g transform="translate(48, 44)">
      <!-- Header -->
      <text x="0" y="36" fill="#FFFFFF" font-size="26" font-weight="800">Relevansi Substantif &amp; Nilai Aksi</text>
      
      <!-- Body Text -->
      <text x="0" y="80" fill="#E6FFFA" font-size="17" font-weight="400">Hasil evaluasi membuktikan bahwa klaster bukan artifisial matematis,</text>
      <text x="0" y="112" fill="#E6FFFA" font-size="17" font-weight="400">melainkan merefleksikan tipologi riil lapangan: Perkotaan Maju,</text>
      <text x="0" y="144" fill="#E6FFFA" font-size="17" font-weight="400">Pedesaan Tertinggal Pendidikan, dan Wilayah 3T Krisis Sanitasi.</text>
      <text x="0" y="176" fill="#A7F3D0" font-size="16" font-weight="600">→ Memberikan dasar intervensi kebijakan yang presisi antardaerah.</text>
    </g>
  </g>

</svg>
